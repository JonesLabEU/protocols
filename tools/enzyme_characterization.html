<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Enzyme characterization</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel2: #f1f3f6;
      --line: #e2e6ea;
      --txt: #1c2530;
      --muted: #667085;
      --accent: #2563eb;
      --bad: #dc2626;
      --chrome: 168px;   /* page margins, heading and plot toolbar above the figure */
      --plot-max: 600px;
      --ok: #15803d;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px
    }

    /* inputs beside the plot once there is room for both, stacked below that */
    .cols {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1fr)
    }

    /* the figure has a readable size of its own; it should not stretch to fill the window */
    .plotwrap {
      max-width: var(--plot-max);
      margin: 0 auto
    }

    .cols > .panel:last-child {
      max-width: calc(var(--plot-max) + 38px)
    }

    @media (min-width: 1280px) {
      .cols {
        grid-template-columns: minmax(420px, 1fr) calc(var(--plot-max) + 38px);
        align-items: start
      }

      .cols > .panel {
        margin-bottom: 0
      }

      /* on a short window, shrink further so the whole figure still fits the viewport height */
      .plotwrap {
        max-width: min(var(--plot-max), calc((100vh - var(--chrome)) * 900 / 620))
      }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 14px
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 18px
    }

    .inputs {
      display: grid;
      grid-template-columns: clamp(250px, 52%, 390px) minmax(0, 1fr);
      gap: 22px
    }

    @media (max-width: 520px) {
      .inputs {
        grid-template-columns: 1fr
      }
    }

    /* tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line)
    }

    .tab {
      border: 1px solid transparent;
      border-bottom: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      margin-bottom: -1px
    }

    .tab:hover {
      color: var(--accent)
    }

    .tab.on {
      background: var(--panel);
      border-color: var(--line);
      border-bottom-color: var(--panel);
      color: var(--txt);
      font-weight: 600
    }

    /* data grid */
    .grid-wrap {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 6px
    }

    #dataGrid {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed
    }

    #dataGrid th {
      position: sticky;
      top: 0;
      background: var(--panel2);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      padding: 5px 8px;
      text-align: left;
      white-space: normal;
      line-height: 1.3;
      vertical-align: bottom;
      z-index: 1
    }

    #dataGrid th.ix {
      width: 30px
    }

    #dataGrid td {
      padding: 0;
      border-bottom: 1px solid var(--line)
    }

    #dataGrid td.idx {
      width: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      cursor: e-resize;
      user-select: none
    }

    #dataGrid input {
      width: 100%;
      border: none;
      padding: 5px 8px;
      font: inherit;
      font-size: 14px;
      background: transparent;
      color: var(--txt);
      font-variant-numeric: tabular-nums
    }

    #dataGrid input:focus {
      outline: 2px solid rgba(37, 99, 235, .4);
      outline-offset: -2px;
      background: #f8faff
    }

    #dataGrid input.bad {
      background: #fef2f2;
      color: var(--bad)
    }

    #dataGrid td.div {
      border-right: 1px solid var(--line)
    }

    #dataGrid td.sel {
      background: rgba(37, 99, 235, .13)
    }

    #dataGrid th[data-c] {
      cursor: s-resize;
      user-select: none
    }

    #dataGrid th br + select {
      margin-top: 2px
    }

    #dataGrid th select {
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel);
      color: var(--txt);
      font: inherit;
      font-size: 12px;
      padding: 0 2px;
      cursor: pointer
    }

    #dataGrid th select:focus {
      outline: none;
      border-color: var(--accent)
    }

    .grid-wrap:focus {
      outline: none
    }

    .grid-wrap.dragging,
    .grid-wrap.dragging input {
      user-select: none
    }

    .grid-wrap.dragging input::selection {
      background: transparent
    }

    /* formula */
    .formula {
      font: italic 25px/1.2 'Cambria Math', Cambria, 'Times New Roman', serif;
      margin: 2px 0 4px;
      color: var(--txt)
    }

    .formula .n {
      font-style: normal
    }

    .formula sup,
    .formula sub {
      font-size: 60%
    }

    .general {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px
    }

    .general i {
      font-family: 'Cambria Math', Cambria, 'Times New Roman', serif
    }

    .opts {
      font-size: 12px;
      color: var(--muted);
      margin: -2px 0 12px
    }

    .opts:empty {
      display: none
    }

    .opts label.chk {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer
    }

    .opts label.chk input {
      margin: 0;
      padding: 0
    }

    .setby {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      color: var(--muted);
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 5px;
      cursor: help;
      white-space: nowrap
    }

    .atbound {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 0 5px;
      cursor: help;
      white-space: nowrap
    }

    .caveats {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px
    }

    #err {
      color: var(--bad);
      font-size: 13px;
      min-height: 18px;
      margin-top: 6px
    }

    table {
      border-collapse: collapse;
      font-size: 13px;
      width: 100%
    }

    th,
    td {
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-variant-numeric: tabular-nums
    }

    th {
      color: var(--muted);
      font-weight: 500;
      width: 52%
    }

    #results td {
      white-space: nowrap
    }

    #results th label {
      cursor: pointer
    }

    #results input.cell {
      width: 86px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
      font: inherit;
      font-size: 13px;
      color: var(--txt);
      background: var(--panel);
      font-variant-numeric: tabular-nums
    }

    #results input.cell:focus {
      outline: none;
      border-color: var(--accent)
    }

    #results input.cell.bad {
      border-color: var(--bad);
      background: #fef2f2
    }

    .sw {
      display: inline-block;
      width: 9px;
      height: 9px;
      transform: rotate(45deg);
      margin-right: 8px
    }

    .phead {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px
    }

    .phead .left {
      margin-right: auto;
      display: flex;
      gap: 8px;
      align-items: center
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel2);
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer
    }

    .btn.sm {
      padding: 3px 10px;
      font-size: 12px
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent)
    }

    .btn.done {
      border-color: var(--ok);
      color: var(--ok)
    }

    .menu {
      position: relative;
      display: inline-flex
    }

    .menu .car {
      font-size: 10px;
      opacity: .7
    }

    .pop {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 8;
      display: none;
      min-width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(16, 24, 40, .12);
      padding: 4px
    }

    .pop.open {
      display: block
    }

    .pop button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: none;
      font: inherit;
      font-size: 13px;
      color: var(--txt);
      padding: 5px 14px 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap
    }

    .pop button:hover {
      background: var(--panel2);
      color: var(--accent)
    }

    /* info bubble on a parameter row */
    .info {
      display: inline-block;
      margin-left: 5px;
      width: 14px;
      height: 14px;
      line-height: 13px;
      text-align: center;
      font-size: 10px;
      font-style: normal;
      font-weight: 700;
      color: var(--muted);
      border: 1px solid #b6bcc6;
      border-radius: 50%;
      cursor: help;
      position: relative;
      vertical-align: 1px
    }

    .info:hover {
      color: var(--accent);
      border-color: var(--accent)
    }

    .info::after {
      content: attr(data-tip);
      position: absolute;
      left: 0;
      top: calc(100% + 7px);
      width: 300px;
      white-space: normal;
      text-align: left;
      font-weight: 400;
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
      background: rgba(28, 37, 48, .95);
      padding: 7px 9px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s;
      z-index: 9
    }

    .info:hover::after {
      opacity: 1
    }

    /* plot */
    .plotwrap {
      position: relative
    }

    #plot {
      width: 100%;
      height: auto;
      display: block
    }

    #plot text {
      font-family: -apple-system, Helvetica, Arial, sans-serif
    }

    #titleInput {
      position: absolute;
      border: none;
      outline: none;
      background: transparent;
      box-shadow: none;
      text-align: center;
      font-weight: 600;
      color: var(--txt);
      padding: 0;
      margin: 0;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      -webkit-appearance: none;
      appearance: none;
      cursor: text;
      transition: color .12s
    }

    #titleInput::placeholder {
      color: #c0c5cc
    }

    #titleInput:hover:not(:focus) {
      color: var(--accent)
    }

    #titlePen {
      position: absolute;
      pointer-events: none;
      color: var(--muted);
      opacity: .45;
      transition: opacity .12s, color .12s;
      line-height: 1
    }

    .plotwrap:has(#titleInput:hover) #titlePen {
      opacity: 1;
      color: var(--accent)
    }

    .plotwrap:has(#titleInput:focus) #titlePen {
      opacity: 0
    }

    .lbl {
      cursor: move
    }

    .pen {
      pointer-events: none
    }

    .pen text {
      fill: #667085;
      opacity: .45;
      transition: opacity .12s, fill .12s
    }

    .lbl .pen text {
      opacity: 0
    }

    .lbl:hover .pen text {
      opacity: .55
    }

    #plot [data-edit-target] {
      transition: fill .12s
    }

    #plot [data-edit-target]:hover {
      fill: var(--accent)
    }

    [data-edit-target].clickable {
      cursor: text
    }

    .svg-edit {
      position: absolute;
      z-index: 5;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
      color: transparent;
      caret-color: var(--txt);
      padding: 0;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      font-family: -apple-system, Helvetica, Arial, sans-serif
    }

    .svg-edit::selection {
      color: transparent;
      background: rgba(37, 99, 235, .25)
    }

    .lbl .grip {
      opacity: .55;
      transition: opacity .12s
    }

    .lbl:hover .grip {
      opacity: 1
    }

    .lbl .close {
      opacity: 0;
      cursor: pointer;
      transition: opacity .12s
    }

    .lbl:hover .close {
      opacity: 1
    }

    #hoverTip {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      display: none;
      background: rgba(28, 37, 48, .92);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      padding: 4px 8px;
      border-radius: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }
  </style>
</head>

<body>
  <div class='wrap'>
    <h1>Enzyme characterization</h1>
    <div class='cols'>

    <div class='panel'>
      <div class='tabs'>
        <button class='tab on' id='tabTime' data-mode='time'>Binding kinetics</button>
        <button class='tab' id='tabConc' data-mode='conc'>Titration</button>
      </div>
      <div class='inputs'>
        <div>
          <div class='grid-wrap' tabindex='-1'>
            <table id='dataGrid'>
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <div id='err'></div>
        </div>
        <div>
          <div class='formula' id='formula'></div>
          <div class='opts' id='opts'></div>
          <table id='results'></table>
          <div class='caveats' id='caveats'></div>
        </div>
      </div>
    </div>

    <div class='panel'>
      <div class='phead'>
        <div class='left'>
          <button class='btn sm' id='scaleBtn' title='Toggle x-axis scale'>Scale: log</button>
        </div>
        <button class='btn' id='resetLayout' title='Restore hidden and moved labels and legend'>&#8634; Reset layout</button>
        <div class='menu'>
          <button class='btn' id='copyBtn' aria-haspopup='true'>Copy <span class='car'>&#9662;</span></button>
          <div class='pop' id='copyPop'><button data-act='copy' data-fmt='svg'>SVG</button><button data-act='copy' data-fmt='png'>PNG</button></div>
        </div>
        <div class='menu'>
          <button class='btn' id='dlBtn' aria-haspopup='true'>&#10515; Download <span class='car'>&#9662;</span></button>
          <div class='pop' id='dlPop'><button data-act='dl' data-fmt='svg'>SVG</button><button data-act='dl' data-fmt='png'>PNG</button></div>
        </div>
      </div>
      <div class='plotwrap'>
        <svg id='plot' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 620'></svg>
        <input type='text' id='titleInput' value='' placeholder='Click to add a title' spellcheck='false' title='Click to edit the title'>
        <span id='titlePen'>&#9998;</span>
      </div>
    </div>

    </div>
  </div>
  <div id='hoverTip'></div>
  <script>
    'use strict';
    const SVGNS = 'http://www.w3.org/2000/svg';
    const $ = id => document.getElementById(id);
    const P = { W: 900, H: 620, mL: 100, mR: 28, mT: 76, mB: 92 };
    const C = { data: '#1c2530', fit: '#2563eb', eq: '#4682b4', elb: '#fa8072', h50: '#8fbc8f' };
    const ELB = 1 / (3 + Math.sqrt(3));   // |y''| maximum against S:E, i.e. substrate per enzyme
    const titleInput = $('titleInput');
    let fitState = null, mode = 'time';

    /* ---- embedding options, read once: ?tab=binding|titration locks to one tab and hides the
       tab bar, &title=none drops the heading, &names=rnp|generic picks the wording. A locked
       titration defaults to the concrete RNP / DNA wording, since that is how it is embedded. ---- */
    const PARAMS = new URLSearchParams([location.search.slice(1), location.hash.slice(1)].filter(Boolean).join('&'));
    const LOCK = {
      binding: 'time', kinetics: 'time', time: 'time', 'binding-kinetics': 'time',
      titration: 'conc', conc: 'conc', activity: 'conc'
    }[(PARAMS.get('tab') || '').toLowerCase().trim()];
    const VOCAB = {   // e / s are the short forms used on the axis and in the narrow table rows
      generic: { E: 'Enzyme', S: 'Substrate', e: 'E', s: 'S', y: 'Fraction converted', conv: 'conversion' },
      rnp: { E: 'RNP', S: 'DNA', e: 'RNP', s: 'DNA', y: 'Cleavage efficiency', conv: 'cleavage' }
    };
    const V = VOCAB[(PARAMS.get('names') || (LOCK ? 'rnp' : 'generic')).toLowerCase().trim()] || VOCAB.generic;
    V.ratio = `${V.e}:${V.s}`;
    V.Conv = V.conv[0].toUpperCase() + V.conv.slice(1);

    /* ======================= UNIFIED MODEL =======================
       y = y_inf + (y_0 - y_inf) exp(-k v)        p = [k, y_inf], y_0 clamped per assay
         time assay: v = t (s),            y_0 = first point (or 1 when normalized), y_inf = f
         titration:  v = [E]/[S],          y_0 = 0,                                  y_inf = plateau
    */
    let Y0 = 1;
    /* p = [log k, y_inf]: fitting log k keeps the rate positive and well scaled across decades */
    const model = (v, p) => p[1] + (Y0 - p[1]) * Math.exp(-Math.exp(p[0]) * v);

    /* ======================= LINEAR ALGEBRA ======================= */
    function solve(A, b) {
      const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
      for (let i = 0; i < n; i++) {
        let piv = i;
        for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[piv][i])) piv = r;
        if (!Number.isFinite(M[piv][i]) || Math.abs(M[piv][i]) < 1e-300) return null;
        [M[i], M[piv]] = [M[piv], M[i]];
        for (let r = 0; r < n; r++) {
          if (r === i) continue;
          const f = M[r][i] / M[i][i];
          for (let c = i; c <= n; c++) M[r][c] -= f * M[i][c];
        }
      }
      return M.map((r, i) => r[n] / r[i]);
    }
    function inv(A) {
      const n = A.length, cols = [];
      for (let j = 0; j < n; j++) {
        const e = new Array(n).fill(0); e[j] = 1;
        const c = solve(A.map(r => r.slice()), e);
        if (!c) return null;
        cols.push(c);
      }
      return A.map((_, i) => cols.map(c => c[i]));
    }

    /* ======================= LEVENBERG-MARQUARDT =======================
       Weighted least squares with box bounds, applied by projecting each step back
       into the box. Weights are 1/sigma when the uncertainty column is filled. */
    function lmFit(p0, pts, lo, hi) {
      const n = pts.length, m = p0.length;
      const clamp = p => p.map((v, i) => Math.min(Math.max(v, lo[i]), hi[i]));
      const ssr = p => {
        let s = 0;
        for (const q of pts) {
          const r = q.y - model(q.v, p);
          if (!Number.isFinite(r)) return Infinity;
          s += r * r;
        }
        return s;
      };
      let p = clamp(p0.slice()), cur = ssr(p), lam = 1e-3;
      if (!Number.isFinite(cur)) return null;
      const jac = p => {
        const JtJ = Array.from({ length: m }, () => new Array(m).fill(0)), Jtr = new Array(m).fill(0);
        for (const q of pts) {
          const base = model(q.v, p), r = q.y - base, row = new Array(m);
          for (let j = 0; j < m; j++) {
            const h = Math.max(1e-9, Math.abs(p[j]) * 1e-6), pp = p.slice();
            pp[j] += h;
            row[j] = (model(q.v, pp) - base) / h;
          }
          for (let i = 0; i < m; i++) {
            Jtr[i] += row[i] * r;
            for (let j = 0; j < m; j++) JtJ[i][j] += row[i] * row[j];
          }
        }
        return { JtJ, Jtr };
      };
      for (let it = 0; it < 400; it++) {
        const { JtJ, Jtr } = jac(p);
        // active set: a parameter resting on a bound whose step would push it further out is
        // held fixed and dropped from the system, so the others still move freely
        const free = [];
        for (let i = 0; i < m; i++) {
          const atLo = p[i] <= lo[i] + 1e-12 && Jtr[i] < 0;
          const atHi = p[i] >= hi[i] - 1e-12 && Jtr[i] > 0;
          if (!atLo && !atHi) free.push(i);
        }
        if (!free.length) break;
        const A = free.map(i => free.map((j) => JtJ[i][j] * (i === j ? 1 + lam : 1) + (i === j ? 1e-14 : 0)));
        const df = solve(A, free.map(i => Jtr[i]));
        if (!df) break;
        const d = new Array(m).fill(0);
        free.forEach((i, fi) => { d[i] = df[fi]; });
        const np = clamp(p.map((v, i) => v + d[i])), ns = ssr(np);
        if (Number.isFinite(ns) && ns < cur) {
          const done = Math.abs(cur - ns) <= 1e-14 * Math.max(1, cur);
          p = np; cur = ns; lam = Math.max(lam / 10, 1e-12);
          if (done) break;
        } else { lam *= 10; if (lam > 1e13) break; }
      }
      const { JtJ } = jac(p), Ci = inv(JtJ);
      const s2 = n > m ? cur / (n - m) : NaN;
      const se = Ci ? Ci.map((r, i) => Math.sqrt(Math.max(r[i], 0) * s2)) : p.map(() => NaN);
      const mean = pts.reduce((a, q) => a + q.y, 0) / n;
      const sst = pts.reduce((a, q) => a + (q.y - mean) ** 2, 0);
      const r2 = sst > 0 ? 1 - cur / sst : NaN;
      const r2adj = n - m - 1 > 0 ? 1 - (1 - r2) * (n - 1) / (n - m - 1) : NaN;
      const kBound = p[0] <= lo[0] + 1e-9 ? 'lower' : p[0] >= hi[0] - 1e-9 ? 'upper' : null;
      return { p, se, r2, r2adj, ssr: cur, kBound };
    }

    const K_MIN_PER_MIN = 1e-8, K_MAX_PER_MIN = 1e1;   // time assay: k bounds in min^-1

    function doFit(pts) {
      const vs = pts.map(q => q.v).filter(v => v > 0), ys = pts.map(q => q.y);
      const vmax = vs.length ? Math.max(...vs) : 1, vmin = vs.length ? Math.min(...vs) : 1;
      const ymin = Math.min(...ys), ymax = Math.max(...ys), span = (ymax - ymin) || 1;
      // time: k is per second internally, so the per-minute bounds are divided by 60.
      // concentration: v is a bare ratio, so the bounds follow the decades the data can resolve.
      const kLo = mode === 'time' ? K_MIN_PER_MIN / 60 : 1e-4 / vmax;
      const kHi = mode === 'time' ? K_MAX_PER_MIN / 60 : 1e4 / vmin;
      const lo = [Math.log(kLo), ymin - 0.25 * span];
      const hi = [Math.log(kHi), ymax + 0.25 * span];
      const yInf0 = Math.min(Math.max(ys[ys.length - 1], lo[1]), hi[1]);
      let best = null;
      for (let u = lo[0]; u <= hi[0] + 1e-9; u += (hi[0] - lo[0]) / 12) {
        const r = lmFit([u, yInf0], pts, lo, hi);
        if (r && Number.isFinite(r.ssr) && (!best || r.ssr < best.ssr - 1e-12)) best = r;
      }
      if (best) { best.lo = lo; best.hi = hi; }
      return best;
    }

    /* ======================= PROFILE LIKELIHOOD =======================
       When k rests on a bound its standard error is meaningless. Scan k, refit y_inf at
       each value, and report the range of k the data cannot distinguish from the best fit. */
    const T975 = [, 12.706, 4.303, 3.182, 2.776, 2.571, 2.447, 2.365, 2.306, 2.262, 2.228,
      2.201, 2.179, 2.160, 2.145, 2.131, 2.120, 2.110, 2.101, 2.093, 2.086,
      2.080, 2.074, 2.069, 2.064, 2.060, 2.056, 2.052, 2.048, 2.045, 2.042];
    const tCrit = d => d < 1 ? NaN : (d <= 30 ? T975[d] : 1.96 + 2.4 / d);

    function profileK(pts, lo, hi) {
      const n = pts.length, m = 2, d = n - m;
      if (d < 1) return null;
      // at fixed k the model is linear in y_inf, so the inner fit is closed form
      const ssrAt = u => {
        const k = Math.exp(u);
        let sbb = 0, sby = 0;
        for (const q of pts) {
          const E = Math.exp(-k * q.v), B = 1 - E;
          sbb += B * B; sby += B * (q.y - Y0 * E);
        }
        let yInf = sbb > 0 ? sby / sbb : Y0;
        yInf = Math.min(Math.max(yInf, lo[1]), hi[1]);
        let ss = 0;
        for (const q of pts) { const E = Math.exp(-k * q.v); const r = q.y - (Y0 * E + yInf * (1 - E)); ss += r * r; }
        return ss;
      };
      const N = 400, us = [], ss = [];
      for (let i = 0; i <= N; i++) { const u = lo[0] + (hi[0] - lo[0]) * i / N; us.push(u); ss.push(ssrAt(u)); }
      let iBest = 0;
      for (let i = 1; i <= N; i++) if (ss[i] < ss[iBest]) iBest = i;
      const thr = ss[iBest] * (1 + tCrit(d) ** 2 / d);
      const cross = (i0, step) => {   // walk out from the optimum to the threshold
        let i = i0;
        while (i + step >= 0 && i + step <= N && ss[i + step] <= thr) i += step;
        if (i + step < 0 || i + step > N) return null;   // still inside at the grid edge
        let a = us[i], b = us[i + step];                 // bisect the crossing
        for (let it = 0; it < 40; it++) { const c = (a + b) / 2; if (ssrAt(c) <= thr) a = c; else b = c; }
        return Math.exp((a + b) / 2);
      };
      return { lower: cross(iBest, -1), upper: cross(iBest, 1), level: 95 };
    }

    /* ======================= UNITS ======================= */
    const toNum = v => { const t = String(v).trim().replace(',', '.'); return t === '' ? NaN : Number(t); };
    const MISSING = /^(|nan|na|n\/a|nd|n\.d\.|null|none|-|\u2013|\u2014|\.|\?)$/i;
    const isMissing = v => MISSING.test(String(v).trim());
    const TIME_S = { s: 1, min: 60, h: 3600, d: 86400 };
    const TIME_ALIAS = {
      s: 's', sec: 's', secs: 's', second: 's', seconds: 's',
      m: 'min', min: 'min', mins: 'min', minute: 'min', minutes: 'min',
      h: 'h', hr: 'h', hrs: 'h', hour: 'h', hours: 'h',
      d: 'd', day: 'd', days: 'd'
    };
    const CONC_NM = { fm: 1e-6, pm: 1e-3, nm: 1, um: 1e3, mm: 1e6, m: 1e9 };
    const CONC_ALIAS = { fm: 'fm', pm: 'pm', nm: 'nm', um: 'um', 'µm': 'um', mm: 'mm', m: 'm' };

    function splitNum(t) {
      const m = /^(-?\d*\.?\d+(?:e[-+]?\d+)?)\s*([a-zµ]*)$/.exec(t);
      return m ? { val: Number(m[1]), suf: m[2] } : null;
    }
    function parseTime(v) {   // always seconds; the column unit applies to bare numbers only
      const t = String(v).trim().toLowerCase().replace(',', '.');
      if (t === '') return NaN;
      const s = splitNum(t); if (!s) return NaN;
      const u = TIME_ALIAS[(s.suf || $('tUnit').value).toLowerCase()];
      return u ? s.val * TIME_S[u] : NaN;
    }
    function parseConc(v, unitId) {   // always nM; the column unit applies to bare numbers only
      const t = String(v).trim().toLowerCase().replace(',', '.').replace(/\s+/g, '');
      if (t === '') return NaN;
      const s = splitNum(t); if (!s) return NaN;
      const u = CONC_ALIAS[(s.suf || $(unitId).value).toLowerCase()];   // the µM option needs the alias too
      return u ? s.val * CONC_NM[u] : NaN;
    }

    /* ======================= MODE CONFIG ======================= */
    const MODES = {
      time: {
        title: 'Binding affinity',
        cols: [
          { key: 't', kind: 'time', unitId: 'tUnit', width: '46%', div: true, head: `Time (<i>t</i>)<br><select id='tUnit'><option>s</option><option>min</option><option>h</option><option>d</option></select>` },
          { key: 'y', kind: 'num', head: 'Fraction unbound (<i>y</i>)' }
        ],
        rows: [['0', '0.996'], ['10 s', '0.996'], ['30 s', '1'], ['1 min', '0.90'], ['3 min', '0.85'],
          ['10 min', '0.70'], ['30 min', '0.60'], ['100 min', '0.40'], ['300 min', '0.20'], ['1000 min', '0.05']],
        sym: 't',
        xlab: 'Time, s', ylab: 'Fraction unbound',
        scale: 'log'
      },
      conc: {
        title: 'Enzyme activity',
        cols: [
          { key: 'rnp', kind: 'conc', unitId: 'uRnp', width: '32%', div: true, head: `[${V.E}]<br><select id='uRnp'><option>pM</option><option selected>nM</option><option>µM</option></select>` },
          { key: 'dna', kind: 'conc', unitId: 'uDna', width: '36%', div: true, head: `[${V.S}]<br><select id='uDna'><option>pM</option><option selected>nM</option><option>µM</option></select>` },
          { key: 'y', kind: 'num', head: `${V.y} (<i>y</i>)` }
        ],
        rows: [['0.3333', '10', '0.0975'], ['1', '10', '0.0982'], ['3.333', '10', '0.3909'], ['10', '10', '0.9271'],
          ['33.33', '10', '0.9643'], ['100', '10', '0.9641'], ['333.3', '10', '0.9696']],
        sym: 'r',
        xlab: `${V.ratio} ratio`, ylab: V.y,
        scale: 'log'
      }
    };

    /* per-tab state, so switching tabs keeps data and layout */
    const ST = {};
    for (const m in MODES) {
      const cfg = MODES[m];
      ST[m] = {
        rows: cfg.rows.map(r => {
          const o = {}; cfg.cols.forEach((c, i) => o[c.key] = String(r[i] ?? '')); return o;
        }),
        texts: {
          xlab: cfg.xlab, ylab: cfg.ylab, legData: 'Data', legFit: 'Fit',
          eq: 'Equimolar', elb: 'Enzyme activity', h50: `50% ${V.conv}`,
          xlo: `${V.e} < ${V.s}`, xhi: `${V.e} > ${V.s}`
        },
        lblOff: {}, hidden: {}, title: cfg.title, scale: cfg.scale,
        rnpConc: '10 nM'
      };
    }
    const cfg = () => MODES[mode];
    const st = () => ST[mode];
    const cols = () => cfg().cols;
    const blankRow = () => { const o = {}; cols().forEach(c => o[c.key] = ''); return o; };
    const isBlank = r => cols().every(c => !String(r[c.key] ?? '').trim());
    // a row is skipped, not rejected, when a required cell is empty or marked nan / - / na
    const isSkipped = r => cols().some(c => !c.optional && isMissing(r[c.key] ?? ''));
    const colOf = key => cols().find(c => c.key === key);
    function parseCell(col, v) {
      if (col.kind === 'time') return parseTime(v);
      if (col.kind === 'conc') return parseConc(v, col.unitId);
      return toNum(v);
    }

    /* ======================= DATA GRID ======================= */
    const MIN_ROWS = 20, SPARE = 10;
    const rows = () => st().rows;
    function lastFilled() { const r = rows(); for (let i = r.length - 1; i >= 0; i--) if (!isBlank(r[i])) return i; return -1; }
    function wantRows() { return Math.max(MIN_ROWS, lastFilled() + 1 + SPARE); }
    function makeRow(i) {
      const tr = document.createElement('tr');
      let h = `<td class='idx'>${i + 1}</td>`;
      cols().forEach(c => {
        h += `<td class='${c.div ? 'div' : ''}'><input data-r='${i}' data-c='${c.key}' inputmode='decimal'></td>`;
      });
      tr.innerHTML = h;
      cols().forEach(c => { tr.querySelector(`[data-c='${c.key}']`).value = rows()[i][c.key] ?? ''; });
      return tr;
    }
    function ensureRows() {
      const tb = document.querySelector('#dataGrid tbody');
      while (rows().length < wantRows()) { rows().push(blankRow()); tb.appendChild(makeRow(rows().length - 1)); }
    }
    function buildHead() {
      let h = `<tr><th class='ix'></th>`;
      cols().forEach(c => {
        h += `<th data-c='${c.key}' title='Select column'${c.width ? ` style='width:${c.width}'` : ''}>${c.head}</th>`;
      });
      document.querySelector('#dataGrid thead').innerHTML = h + '</tr>';
      document.querySelectorAll('#dataGrid th[data-c]').forEach(th => th.addEventListener('mousedown', headDown));
      document.querySelectorAll('#dataGrid th select').forEach(s => s.addEventListener('change', () => { markBad(); render(); }));
    }
    function fitGridHeight() {
      const wrap = document.querySelector('.grid-wrap'), head = document.querySelector('#dataGrid thead');
      const row = document.querySelector('#dataGrid tbody tr'); if (!row || !row.offsetHeight) return;
      wrap.style.maxHeight = (head.offsetHeight + row.offsetHeight * 10.8) + 'px';
    }
    function buildGrid(focus) {
      while (rows().length < wantRows()) rows().push(blankRow());
      const tb = document.querySelector('#dataGrid tbody'); tb.innerHTML = '';
      rows().forEach((r, i) => tb.appendChild(makeRow(i)));
      markBad(); markSel(); fitGridHeight();
      if (focus) { const el = tb.querySelector(`input[data-r='${focus.r}'][data-c='${focus.c}']`); if (el) { el.focus(); el.select(); } }
    }
    function markBad() {
      document.querySelectorAll('#dataGrid tbody input').forEach(el => {
        const r = rows()[+el.dataset.r], v = el.value.trim(), col = colOf(el.dataset.c);
        if (!r || !col) return;
        const n = parseCell(col, v);
        let bad = !isMissing(v) && !Number.isFinite(n);
        if (Number.isFinite(n) && ((col.kind === 'conc' && n <= 0))) bad = true;
        el.classList.toggle('bad', bad);
      });
    }

    const tbody = document.querySelector('#dataGrid tbody'), gridWrap = document.querySelector('.grid-wrap');
    let sel = null, selDrag = null;
    const nCols = () => cols().length;
    const keyAt = c => cols()[c].key;
    const selBox = () => sel && {
      r0: Math.min(sel.a.r, sel.b.r), r1: Math.max(sel.a.r, sel.b.r),
      c0: Math.min(sel.a.c, sel.b.c), c1: Math.max(sel.a.c, sel.b.c)
    };
    const isMulti = () => { const b = selBox(); return !!b && (b.r1 > b.r0 || b.c1 > b.c0); };
    function markSel() {
      const b = isMulti() ? selBox() : null;
      tbody.querySelectorAll('input').forEach(el => {
        const r = +el.dataset.r, c = cols().findIndex(x => x.key === el.dataset.c);
        el.parentElement.classList.toggle('sel', !!b && r >= b.r0 && r <= b.r1 && c >= b.c0 && c <= b.c1);
      });
    }
    function setSel(a, b) { sel = a ? { a, b: b || a } : null; markSel(); }
    function cellOf(target) {
      const td = target.closest && target.closest('td'); if (!td || !tbody.contains(td)) return null;
      const tr = td.parentElement, r = [...tbody.children].indexOf(tr);
      if (td.classList.contains('idx')) return { r, c: -1 };
      const inp = td.querySelector('input');
      return inp ? { r, c: cols().findIndex(x => x.key === inp.dataset.c) } : null;
    }
    const inputAt = cell => tbody.querySelector(`input[data-r='${cell.r}'][data-c='${keyAt(cell.c)}']`);
    function headDown(e) {
      if (e.target.closest('select')) return;
      e.preventDefault(); gridWrap.focus();
      const c = cols().findIndex(x => x.key === e.currentTarget.dataset.c), last = Math.max(lastFilled(), 0);
      if (e.shiftKey && sel) setSel({ r: 0, c: sel.a.c }, { r: last, c });
      else setSel({ r: 0, c }, { r: last, c });
    }
    tbody.addEventListener('mousedown', e => {
      const cell = cellOf(e.target); if (!cell || e.button !== 0) return;
      if (cell.c === -1) {
        e.preventDefault(); gridWrap.focus();
        const a = e.shiftKey && sel ? { r: sel.a.r, c: 0 } : { r: cell.r, c: 0 };
        setSel(a, { r: cell.r, c: nCols() - 1 }); selDrag = { rows: true, moved: true };
        return;
      }
      const inp = inputAt(cell), editing = document.activeElement === inp;
      if (e.shiftKey && sel) { e.preventDefault(); gridWrap.focus(); setSel(sel.a, cell); selDrag = { rows: false, moved: true }; return; }
      if (!editing) e.preventDefault();
      setSel(cell); selDrag = { rows: false, moved: false, cell, editing };
    });
    window.addEventListener('mousemove', e => {
      if (!selDrag || !sel) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && cellOf(el); if (!cell) return;
      const b = selDrag.rows ? { r: cell.r, c: nCols() - 1 } : { r: cell.r, c: Math.max(cell.c, 0) };
      if (b.r === sel.b.r && b.c === sel.b.c) return;
      setSel(sel.a, b);
      if (isMulti() && !selDrag.moved) { selDrag.moved = true; gridWrap.classList.add('dragging'); }
      if (selDrag.moved) {
        const ae = document.activeElement;
        if (ae && ae.tagName === 'INPUT' && gridWrap.contains(ae)) { const n = ae.selectionStart; ae.setSelectionRange(n, n); ae.blur(); }
        if (document.activeElement !== gridWrap) gridWrap.focus();
        window.getSelection().removeAllRanges();
        e.preventDefault();
      }
    });
    window.addEventListener('mouseup', () => {
      if (selDrag && !selDrag.moved && !selDrag.rows && !selDrag.editing) {
        const inp = inputAt(selDrag.cell);
        if (inp) { inp.focus(); const n = inp.value.length; inp.setSelectionRange(n, n); }
      }
      selDrag = null; gridWrap.classList.remove('dragging');
    });
    document.addEventListener('mousedown', e => { if (!gridWrap.contains(e.target)) setSel(null); });
    gridWrap.addEventListener('keydown', e => {
      if (!isMulti()) return;
      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        const b = selBox();
        for (let r = b.r0; r <= b.r1; r++) for (let c = b.c0; c <= b.c1; c++) rows()[r][keyAt(c)] = '';
        buildGrid(); gridWrap.focus(); render();
      } else if (e.key === 'Escape') setSel(null);
    });
    document.addEventListener('copy', e => {
      if (!isMulti() || !gridWrap.contains(document.activeElement)) return;
      const b = selBox(), out = [];
      for (let r = b.r0; r <= b.r1; r++) {
        const line = [];
        for (let c = b.c0; c <= b.c1; c++) line.push(rows()[r][keyAt(c)]);
        out.push(line.join('\t'));
      }
      e.clipboardData.setData('text/plain', out.join('\n')); e.preventDefault();
    });
    tbody.addEventListener('input', e => {
      const el = e.target; if (el.tagName !== 'INPUT') return;
      rows()[+el.dataset.r][el.dataset.c] = el.value;
      ensureRows(); markBad(); render();
    });
    tbody.addEventListener('keydown', e => {
      const el = e.target; if (el.tagName !== 'INPUT') return;
      const i = +el.dataset.r, c = el.dataset.c;
      let t = null;
      if (e.key === 'Enter' || e.key === 'ArrowDown') t = { r: Math.min(i + 1, rows().length - 1), c };
      else if (e.key === 'ArrowUp') t = { r: Math.max(i - 1, 0), c };
      if (t) { e.preventDefault(); const n = tbody.querySelector(`input[data-r='${t.r}'][data-c='${t.c}']`); n.focus(); n.select(); }
    });
    function splitLine(line) {
      if (/[\t;]/.test(line)) return line.split(/[\t;]/).map(f => f.trim());
      const f = line.trim().split(/\s+/);
      return f.length > 1 ? f : line.split(',').map(f => f.trim());
    }
    tbody.addEventListener('paste', e => {
      const el = e.target; if (el.tagName !== 'INPUT') return;
      const text = (e.clipboardData || window.clipboardData).getData('text');
      if (!/\t|\n|;/.test(text)) return;   // single value: let the browser paste it
      e.preventDefault();
      const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
      const start = cols().findIndex(x => x.key === el.dataset.c);
      let i = +el.dataset.r;
      for (const line of lines) {
        const f = splitLine(line);
        if (f.length && !Number.isFinite(parseCell(cols()[start], f[0]))) continue;   // header line
        if (!rows()[i]) rows()[i] = blankRow();
        f.forEach((val, j) => {
          const c = cols()[start + j];
          if (c) rows()[i][c.key] = val;
        });
        i++;
      }
      buildGrid({ r: Math.min(i, rows().length - 1), c: el.dataset.c }); render();
    });

    /* ======================= SVG HELPERS ======================= */
    function E(tag, attrs, parent) {
      const e = document.createElementNS(SVGNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }
    function T(parent, x, y, txt, attrs = {}) {
      const t = E('text', Object.assign({ x, y, 'font-size': 24, fill: '#1c2530' }, attrs), parent);
      t.textContent = txt; return t;
    }
    function powTick(parent, x, y, exp) {
      const t = E('text', { x, y, 'font-size': 24, fill: '#1c2530', 'text-anchor': 'middle' }, parent);
      E('tspan', {}, t).textContent = '10';
      E('tspan', { 'font-size': 16, dy: -10 }, t).textContent = String(exp);
      return t;
    }
    function diamond(parent, cx, cy, fill, r = 10) {
      return E('path', { d: `M${cx} ${cy - r}L${cx + r} ${cy}L${cx} ${cy + r}L${cx - r} ${cy}Z`, fill }, parent);
    }
    const BASE_TEXTS = () => ({
      xlab: cfg().xlab, ylab: cfg().ylab, legData: 'Data', legFit: 'Fit',
      eq: 'Equimolar', elb: 'Enzyme activity', h50: `50% ${V.conv}`,
      xlo: `${V.e} < ${V.s}`, xhi: `${V.e} > ${V.s}`
    });
    let editing = null;
    const texts = () => st().texts;

    function addPen(parent, key, x, y, opts = {}) {
      if (editing && editing.key === key) return null;
      const g = E('g', { class: 'pen hover-el', transform: `translate(${x} ${y})${opts.rotate ? ' rotate(-90)' : ''}` }, parent);
      T(g, 0, 0, '✎', { 'font-size': opts.size || 20, 'text-anchor': 'middle', 'dominant-baseline': 'central' });
      return g;
    }
    function movable(parent, key) {
      const off = st().lblOff[key] || { dx: 0, dy: 0 };
      const g = E('g', { class: 'lbl', transform: `translate(${off.dx} ${off.dy})` }, parent);
      g.dataset.key = key;
      E('title', {}, g).textContent = 'Click text to edit, drag to move';
      return g;
    }
    function addGrip(g, x, y, h) {
      const w = 14, c = E('g', { class: 'grip hover-el', transform: `translate(${x - w - 2} ${y})` }, g);
      E('rect', { width: w, height: h, rx: 3, fill: '#f1f3f6', stroke: '#98a2b3' }, c);
      for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++)
        E('circle', { cx: 4.5 + j * 5, cy: h / 2 + (i - 1) * 5, r: 1.4, fill: '#667085' }, c);
    }
    function addClose(g, x, y) {
      const c = E('g', { class: 'close hover-el', transform: `translate(${x} ${y})` }, g);
      E('title', {}, c).textContent = 'Hide';
      E('circle', { r: 10, fill: '#fff', stroke: '#98a2b3' }, c);
      E('path', { d: 'M-4 -4L4 4M4 -4L-4 4', stroke: '#475467', 'stroke-width': 1.5, 'stroke-linecap': 'round' }, c);
    }
    function labelBox(parent, x, y, txt, fill, key, val) {
      if (st().hidden[key]) return;
      const g = movable(parent, key);
      const bg = E('rect', { fill, rx: 3 }, g);
      const t = T(g, x, y, '', { 'font-size': 24 });
      E('tspan', { 'data-edit-target': key }, t).textContent = txt;
      E('tspan', {}, t).textContent = val;
      const b = t.getBBox();
      let dx = 0;
      if (b.x + b.width + 6 > P.W - P.mR) dx = (P.W - P.mR) - (b.x + b.width + 6);
      if (b.x + dx < P.mL) dx = P.mL - b.x;
      if (dx) t.setAttribute('x', x + dx);
      bg.setAttribute('x', b.x - 5 + dx); bg.setAttribute('y', b.y - 3);
      bg.setAttribute('width', b.width + 10); bg.setAttribute('height', b.height + 6);
      addGrip(g, b.x - 5 + dx, b.y - 3, b.height + 6);
      addPen(g, key, b.x + b.width + 5 + dx + 12, b.y + b.height / 2, { size: 18 });
      addClose(g, b.x + b.width + 5 + dx, b.y - 3);
    }
    const SUPS = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
    const sup = n => String(n).split('').map(c => SUPS[c] || c).join('');
    const fmtNum = v => {
      if (!Number.isFinite(v)) return 'n/a';
      const a = Math.abs(v);
      if (a !== 0 && (a < 1e-3 || a >= 1e5)) {
        const [mant, ex] = v.toExponential(2).split('e');
        return `${+mant}×10${sup(+ex)}`;
      }
      return String(+v.toPrecision(4));
    };
    const fmtT = v => v === 0 ? '0' : fmtNum(v);
    function niceStep(raw) {
      const e = Math.pow(10, Math.floor(Math.log10(Math.abs(raw) || 1)));
      const f = raw / e;
      return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
    }
    const escapeHtml = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    /* ======================= POINTS AND X AXIS =======================
       The fit always runs in v. The plotted x is whichever column actually varies:
       the plotted x is the E:S ratio itself. */
    let AXIS = { xFromV: v => v, vFromX: x => x, label: 'Time, s', name: 't' };
    const vFromX = x => AXIS.vFromX(x);
    const xFromV = v => AXIS.xFromV(v);

    function getPoints() {
      const out = [];
      rows().forEach((r, i) => {
        if (isBlank(r) || isSkipped(r)) return;
        const n = {};
        for (const c of cols()) {
          n[c.key] = parseCell(c, r[c.key]);
          if (c.optional) continue;
          if (!Number.isFinite(n[c.key])) throw new Error(`Row ${i + 1} needs a number in every column.`);
        }
        let v;
        if (mode === 'time') {
          if (n.t < 0) throw new Error(`Row ${i + 1}: time must be >= 0.`);
          v = n.t;
        } else {
          if (n.rnp <= 0 || n.dna <= 0) throw new Error(`Row ${i + 1}: concentrations must be > 0.`);
          v = n.rnp / n.dna;
        }
        out.push({ v, y: n.y, rnp: n.rnp, dna: n.dna });
      });
      if (out.length < 3) throw new Error('Need at least 3 usable points.');
      out.sort((a, b) => a.v - b.v);
      return out;
    }

    function setAxis() {
      AXIS = mode === 'time'
        ? { xFromV: v => v, vFromX: x => x, label: 'Time, s', name: 't' }
        : { xFromV: v => v, vFromX: x => x, label: `${V.ratio} ratio`, name: V.ratio };
    }

    /* ======================= RESULTS SKELETON ======================= */
    const TIPS = {
      elb: `The knee of the curve, where |y″| of the same model written against ${V.s}:${V.e} is largest, `
        + `exactly k/(3+√3) = 0.2113k ${V.S} per ${V.E}. Read as a percentage of productive ${V.E} it assumes `
        + `single turnover, so a value above 100% means more ${V.conv} events than ${V.E} molecules, i.e. multiple `
        + `turnover, and it is then events per ${V.E} rather than an active fraction.`,
      kd: `K_D = y∞ / (y₀ − y∞) × [${V.E}]. Assumes free ${V.E} ≈ total ${V.E}, so it must be in excess `
        + `over the ${V.S}, that y∞ is a real equilibrium plateau rather than an unfinished decay, and that `
        + `binding is a simple 1:1 equilibrium reached within the time course.`,
      infTime: 'The level the curve settles at as t grows, i.e. the fraction still unbound at equilibrium. Only '
        + 'meaningful if the late timepoints have actually levelled off; otherwise the fit is extrapolating.',
      infConc: `The level the curve approaches at saturating ${V.E}, i.e. the highest ${V.conv} reached. Below 1 `
        + `it means some ${V.S} is never converted, from an inactive fraction or an assay ceiling.`,
      y0Time: 'Where the curve starts, at t = 0. Nothing is bound yet, so the unbound fraction is 1 by the '
        + 'physics of the assay. It is set, not fitted, which assumes y is on a 0 to 1 fraction scale.',
      y0Conc: `Where the curve starts, at r = 0. With no ${V.E} in the reaction nothing is converted, so it is 0 `
        + `by the physics of the assay. It is set, not fitted.`,
      half: 'Time to cover half the span from y₀ to y∞, computed as ln(2) / k. It is a property of the rate '
        + 'alone, so it does not depend on y₀ or y∞, and it is in the same time unit as k.',
      r2adj: 'R² penalized for the number of fitted parameters, so models with different parameter counts can be '
        + 'compared. It can be negative, and can fall while R² rises when a parameter earns less than it costs.'
    };
    const info = tip => `<i class='info' data-tip="${escapeHtml(tip).replace(/"/g, '&quot;')}">i</i>`;
    const sw = c => `<span class='sw' style='background:${c}'></span>`;

    function buildResults() {
      const S = st();
      $('opts').innerHTML = cfg().sym === 'r'
        ? `<i>r</i> = [${V.E}] / [${V.S}], the ${V.ratio} molar ratio in each reaction`
        : `<i>t</i> = time since the reaction started`;
      const tt = mode === 'time';
      const fitted = `
        <tr><th>Rate constant <i>k</i>${tt ? ', s<sup>&minus;1</sup>' : ''}</th><td id='rK'></td></tr>
        <tr><th>${tt ? 'Floor' : 'Plateau'} <i>y</i><sub>&infin;</sub>${info(tt ? TIPS.infTime : TIPS.infConc)}</th><td id='rInf'></td></tr>
        <tr><th>Value at <i>${tt ? 't' : 'r'}</i> = 0, <i>y</i><sub>0</sub>${info(tt ? TIPS.y0Time : TIPS.y0Conc)}</th><td id='rY0'></td></tr>`;
      const gof = `
        <tr><th>Goodness of fit <i>R</i><sup>2</sup></th><td id='rR2'></td></tr>
        <tr><th>Adj. <i>R</i><sup>2</sup>${info(TIPS.r2adj)}</th><td id='rR2a'></td></tr>`;
      if (mode === 'time') {
        $('results').innerHTML = fitted + `
          <tr><th>Half-life <i>t</i><sub>1/2</sub>, s${info(TIPS.half)}</th><td id='rHalf'></td></tr>
          <tr><th><label for='rnpConc'>${V.E} conc.</label></th>
            <td><input type='text' class='cell' id='rnpConc' value='${escapeHtml(S.rnpConc)}' title='Total ${V.E} concentration with unit, e.g. 10 nM'></td></tr>
          <tr><th><i>K</i><sub>D</sub>${info(TIPS.kd)}</th><td id='rKd'></td></tr>` + gof;
        $('caveats').innerHTML = '';
        $('rnpConc').addEventListener('input', e => { S.rnpConc = e.target.value; render(); });
      } else {
        $('results').innerHTML = fitted + `
          <tr><th>${sw(C.elb)}Enzyme activity${info(TIPS.elb)}</th><td id='rAct'></td></tr>
          <tr><th>${sw(C.eq)}${V.Conv} at equimolar point</th><td id='rEq'></td></tr>
          <tr><th>${sw(C.h50)}${V.ratio} at 50% ${V.conv}</th><td id='rH50'></td></tr>` + gof;
        $('caveats').innerHTML = '';
      }
    }
    function clearResults() {
      ['rKd', 'rK', 'rHalf', 'rInf', 'rY0', 'rR2', 'rR2a', 'rAct', 'rEq', 'rH50']
        .forEach(id => { const e = $(id); if (e) e.textContent = ''; });
    }
    function parseRnpConc() {
      const m = /^\s*(-?\d*\.?\d+(?:[eE][-+]?\d+)?)\s*(.*?)\s*$/.exec(String(st().rnpConc).replace(',', '.'));
      return m ? { value: Number(m[1]), unit: m[2] || 'nM' } : { value: NaN, unit: 'nM' };
    }
    function setFormula() {
      const x = cfg().sym;   // t for binding kinetics, r = [E]/[S] for the titration
      $('formula').innerHTML = `y <span class='n'>=</span> y<sub>&infin;</sub> <span class='n'>+ (</span>y<sub>0</sub>`
        + ` <span class='n'>&minus;</span> y<sub>&infin;</sub><span class='n'>)</span> e<sup><span class='n'>&minus;</span>k${x}</sup>`;
    }

    /* ======================= PLOT ======================= */
    function render() {
      const svg = $('plot'); svg.innerHTML = '';
      const S = st();
      let pts;
      try { pts = getPoints(); $('err').textContent = ''; }
      catch (e) { $('err').textContent = e.message; fitState = null; clearResults(); return; }

      // y0 is fixed by the assay, not fitted and not chosen: nothing is bound at t = 0,
      // and with no enzyme in the reaction nothing is converted
      Y0 = mode === 'conc' ? 0 : 1;

      setAxis();

      const res = doFit(pts);
      if (!res) { $('err').textContent = 'Fit did not converge.'; fitState = null; clearResults(); return; }
      const p = res.p, k = Math.exp(p[0]), seK = k * res.se[0], yInf = p[1], y0 = Y0;

      // plotted x values
      const xs = pts.map(q => xFromV(q.v)).filter(x => Number.isFinite(x));
      const ys = pts.map(q => q.y);
      const hasZero = mode === 'time' && pts.some(q => q.v === 0);
      const nz = xs.filter(x => x > 0);
      const useLog = S.scale === 'log' && nz.length > 0;
      const xmax = Math.max(...nz), xminNZ = Math.min(...nz);
      const dec = Math.max(1, Math.log10(xmax / xminNZ));
      const L0 = Math.log10(xminNZ) - 0.08 * dec, L1 = Math.log10(xmax) + 0.08 * dec;

      const yvals = ys.concat(pts.map(q => model(q.v, p)).filter(Number.isFinite));
      const ymin = Math.min(0, ...yvals), ymx = Math.max(...yvals), yr = (ymx - ymin) || 1;
      const Ya = ymin - 0.05 * yr, Yb = ymx + 0.05 * yr;

      const pW = P.W - P.mL - P.mR, pH = P.H - P.mT - P.mB;
      const zoneW = (useLog && hasZero) ? 64 : 0;
      const cW = pW - zoneW;
      const sx = x => useLog
        ? (x <= 0 ? P.mL + zoneW / 2 : P.mL + zoneW + (Math.log10(x) - L0) / (L1 - L0) * cW)
        : P.mL + (x / (xmax || 1)) * pW;
      const x2v = px => useLog
        ? Math.pow(10, L0 + (px - P.mL - zoneW) / cW * (L1 - L0))
        : (px - P.mL) / pW * (xmax || 1);
      const sy = y => P.mT + (1 - (y - Ya) / (Yb - Ya)) * pH;

      E('rect', { x: 0, y: 0, width: P.W, height: P.H, fill: '#fff' }, svg);
      const defs = E('defs', {}, svg), cp = E('clipPath', { id: 'clip' }, defs);
      E('rect', { x: P.mL, y: P.mT, width: pW, height: pH }, cp);

      const yticks = [];
      { const step = niceStep((Yb - Ya) / 6), start = Math.ceil(Ya / step) * step;
        for (let v = start; v <= Yb + step / 2; v += step) yticks.push(+v.toPrecision(12)); }
      const linTicks = [];
      if (!useLog) { const step = niceStep((xmax || 1) / 6);
        for (let v = 0; v <= xmax + step / 2; v += step) linTicks.push(+v.toPrecision(12)); }

      const grid = E('g', { stroke: '#d3d3d3', 'stroke-width': 0.6, 'stroke-dasharray': '4 3' }, svg);
      if (useLog) {
        for (let d = Math.floor(L0); d <= Math.ceil(L1); d++)
          for (let m = 1; m <= 9; m++) {
            const v = m * Math.pow(10, d), lv = Math.log10(v);
            if (lv < L0 || lv > L1) continue;
            E('line', { x1: sx(v), x2: sx(v), y1: P.mT, y2: P.mT + pH, opacity: m === 1 ? 1 : 0.45 }, grid);
          }
      } else for (const v of linTicks) E('line', { x1: sx(v), x2: sx(v), y1: P.mT, y2: P.mT + pH }, grid);
      for (const v of yticks) E('line', { x1: P.mL, x2: P.mL + pW, y1: sy(v), y2: sy(v) }, grid);

      E('rect', { x: P.mL, y: P.mT, width: pW, height: pH, fill: 'none', stroke: '#1c2530', 'stroke-width': 1 }, svg);
      const tick = x => E('line', { x1: x, x2: x, y1: P.mT + pH, y2: P.mT + pH + 5, stroke: '#1c2530' }, svg);
      if (useLog) {
        if (hasZero) { tick(sx(0)); T(svg, sx(0), P.mT + pH + 32, '0', { 'text-anchor': 'middle' }); }
        for (let d = Math.ceil(L0); d <= Math.floor(L1); d++) {
          const v = Math.pow(10, d);
          tick(sx(v)); powTick(svg, sx(v), P.mT + pH + 32, d);
        }
      } else for (const v of linTicks) { tick(sx(v)); T(svg, sx(v), P.mT + pH + 32, fmtT(v), { 'text-anchor': 'middle' }); }
      for (const v of yticks) {
        E('line', { x1: P.mL - 5, x2: P.mL, y1: sy(v), y2: sy(v), stroke: '#1c2530' }, svg);
        T(svg, P.mL - 10, sy(v) + 8, fmtNum(v), { 'text-anchor': 'end' });
      }
      if (useLog && hasZero) {
        const bx = P.mL + zoneW * 0.78, by = P.mT + pH;
        E('rect', { x: bx - 6, y: by - 1.5, width: 12, height: 4, fill: '#fff' }, svg);
        for (const off of [-5, 5])
          E('path', { d: `M${bx + off - 6} ${by + 7}L${bx + off + 6} ${by - 7}`, stroke: '#1c2530', 'stroke-width': 1.6 }, svg);
      }

      const xl = T(svg, P.mL + pW / 2, P.H - 16, texts().xlab, { 'text-anchor': 'middle', 'font-size': 26, 'data-edit-target': 'xlab', class: 'clickable' });
      addPen(svg, 'xlab', P.mL + pW / 2 + xl.getComputedTextLength() / 2 + 16, P.H - 24);
      if (mode === 'conc') {   // which side of equimolar you are on
        T(svg, P.mL + 4, P.mT + pH + 62, texts().xlo, { 'font-size': 20, fill: '#667085', 'data-edit-target': 'xlo', class: 'clickable' });
        T(svg, P.mL + pW - 4, P.mT + pH + 62, texts().xhi, { 'font-size': 20, fill: '#667085', 'text-anchor': 'end', 'data-edit-target': 'xhi', class: 'clickable' });
      }
      const ycy = P.mT + pH / 2;
      const yl = T(svg, 28, ycy, texts().ylab, { 'text-anchor': 'middle', 'font-size': 26, transform: `rotate(-90 28 ${ycy})`, 'data-edit-target': 'ylab', class: 'clickable' });
      addPen(svg, 'ylab', 20, ycy - yl.getComputedTextLength() / 2 - 16, { rotate: true });
      T(svg, P.mL + pW / 2, 48, titleInput.value, { 'text-anchor': 'middle', 'font-size': 30, 'font-weight': 600, class: 'title-el', display: 'none' });

      const plot = E('g', { 'clip-path': 'url(#clip)' }, svg);

      // fitted curve, sampled across the plotted axis
      const N = 600;
      let d = '';
      for (let i = 0; i < N; i++) {
        const x = useLog ? Math.pow(10, L0 + (L1 - L0) * i / (N - 1)) : (xmax || 1) * i / (N - 1);
        const y = model(vFromX(x), p);
        if (!Number.isFinite(y)) continue;
        d += (d ? 'L' : 'M') + sx(x).toFixed(2) + ' ' + sy(y).toFixed(2);
      }
      if (useLog && hasZero) {
        const x1 = Math.pow(10, L0);
        E('line', { x1: sx(0), y1: sy(model(0, p)), x2: sx(x1), y2: sy(model(vFromX(x1), p)), stroke: C.fit, 'stroke-width': 2.5, 'stroke-dasharray': '2 4' }, plot);
        E('circle', { cx: sx(0), cy: sy(model(0, p)), r: 4, fill: C.fit }, plot);
      }
      E('path', { d, fill: 'none', stroke: C.fit, 'stroke-width': 3 }, plot);

      // guide lines (concentration assay)
      const vAt = y => {   // invert the model: y = y_inf + (y_0 - y_inf) e^(-kv)
        const r = (y - yInf) / (y0 - yInf);
        return r > 0 && r <= 1 && k > 0 ? -Math.log(r) / k : NaN;
      };
      const guides = [];
      if (mode === 'conc') {
        const vEq = 1, yEq = model(vEq, p);
        const xElb = ELB * k, vElb = 1 / xElb, yElb = model(vElb, p);
        const v50 = vAt(0.5);
        guides.push({ key: 'eq', x: xFromV(vEq), y: yEq, col: C.eq, h: true, v: true, txt: texts().eq, val: `: ${yEq.toFixed(2)}` });
        if (Number.isFinite(vElb) && vElb > 0)
          guides.push({ key: 'elb', x: xFromV(vElb), y: yElb, col: C.elb, h: false, v: false, txt: texts().elb, val: `: ${(xElb * 100).toFixed(0)}%` });
        if (Number.isFinite(v50) && v50 > 0)
          guides.push({ key: 'h50', x: xFromV(v50), y: 0.5, col: C.h50, h: true, v: true, txt: texts().h50, val: `: ${fmtNum(v50)}` });
        const dash = { 'stroke-dasharray': '8 6', 'stroke-width': 2 };
        for (const g of guides) {
          if (g.v) E('line', Object.assign({ x1: sx(g.x), x2: sx(g.x), y1: sy(Ya), y2: sy(g.y), stroke: g.col }, dash), plot);
          if (g.h) E('line', Object.assign({ x1: P.mL, x2: sx(g.x), y1: sy(g.y), y2: sy(g.y), stroke: g.col }, dash), plot);
        }
      }

      for (const q of pts) E('circle', { cx: sx(xFromV(q.v)), cy: sy(q.y), r: 8, fill: C.data }, plot);
      for (const g of guides) diamond(plot, sx(g.x), sy(g.y), g.col);

      // legend
      if (!S.hidden.legend) {
        const lg = movable(svg, 'legend'), gi = E('g', {}, lg);
        const lx = P.mL + 44 + zoneW, ly = P.mT + pH - 100;
        const lbg = E('rect', { x: lx - 10, y: ly - 10, rx: 4, fill: '#fff', 'fill-opacity': 0.88, stroke: '#d0d5dd' }, gi);
        E('circle', { cx: lx + 16, cy: ly + 18, r: 8, fill: C.data }, gi);
        const td = T(gi, lx + 44, ly + 26, texts().legData, { 'data-edit-target': 'legData' });
        E('line', { x1: lx, x2: lx + 32, y1: ly + 62, y2: ly + 62, stroke: C.fit, 'stroke-width': 3 }, gi);
        const tf = T(gi, lx + 44, ly + 70, texts().legFit, { 'data-edit-target': 'legFit' });
        const right = Math.max(lx + 44 + td.getComputedTextLength(), lx + 44 + tf.getComputedTextLength());
        const lw = right - (lx - 10) + 40, lh = 96;
        lbg.setAttribute('width', lw); lbg.setAttribute('height', lh);
        addPen(gi, 'legData', lx + 44 + td.getComputedTextLength() + 16, ly + 18, { size: 18 });
        addPen(gi, 'legFit', lx + 44 + tf.getComputedTextLength() + 16, ly + 62, { size: 18 });
        addGrip(gi, lx - 10, ly - 10, lh);
        addClose(gi, lx - 10 + lw, ly - 10);
        // a rising curve leaves the bottom right free, a falling one the bottom left
        const rising = model(1e9, p) > model(0, p);
        if (rising) gi.setAttribute('transform', `translate(${(P.mL + pW - 26) - (lx - 10 + lw)} 0)`);
      }

      for (const g of guides) labelBox(svg, sx(g.x) + 14, sy(g.y) - 14, g.txt, g.col === C.eq ? '#b0c4de' : g.col, g.key, g.val);

      fitState = { pts, p, sx, sy, x2v, pW, pH, useLog, zoneW };
      fitState.hLine = E('line', { class: 'hover-el', y1: P.mT, y2: P.mT + pH, stroke: '#475467', 'stroke-width': 1, 'pointer-events': 'none', display: 'none' }, svg);
      fitState.hDot = E('circle', { class: 'hover-el', r: 4, fill: '#000', stroke: '#fff', 'stroke-width': 1.5, 'pointer-events': 'none', display: 'none' }, svg);

      // results
      const pm = (v, s) => Number.isFinite(s) ? `${fmtNum(v)} ± ${fmtNum(s)}` : fmtNum(v);
      let kTxt = escapeHtml(pm(k, seK)), halfTxt = fmtNum(k > 0 ? Math.LN2 / k : NaN);
      if (res.kBound) {
        const pr = profileK(pts, res.lo, res.hi);
        const lim = pr && (res.kBound === 'upper' ? pr.lower : pr.upper);
        const tip = `k ran into its ${res.kBound} bound: rates beyond it fit the data just as well, so the point `
          + `estimate and its error mean nothing. The limit is where the fit becomes significantly worse `
          + `(F-test at 95%, y\u221e refitted at each k). Add points across the transition to pin it down.`;
        if (Number.isFinite(lim)) {
          const gt = res.kBound === 'upper';
          kTxt = `${gt ? '&gt;' : '&lt;'} ${escapeHtml(fmtNum(lim))}`;
          halfTxt = `${gt ? '<' : '>'} ${fmtNum(Math.LN2 / lim)}`;
          kTxt += ` <span class='atbound' title='${tip}'>95% limit</span>`;
        } else {
          kTxt += ` <span class='atbound' title='${tip}'>at ${res.kBound} bound</span>`;
        }
      }
      $('rK').innerHTML = kTxt;
      $('rInf').textContent = pm(yInf, res.se[1]);
      $('rY0').innerHTML = escapeHtml(fmtNum(y0))
        + ` <span class='setby' title='Set by the physics of the assay rather than fitted, so it costs no degree of freedom.'>set by assay</span>`;
      $('rR2').textContent = Number.isFinite(res.r2) ? res.r2.toFixed(4) : 'n/a';
      $('rR2a').textContent = Number.isFinite(res.r2adj) ? res.r2adj.toFixed(4) : 'n/a';
      if (mode === 'time') {
        const rnp = parseRnpConc();
        const fBound = y0 - yInf;
        const ratio = fBound > 0 ? yInf / fBound : NaN;
        const kd = Number.isFinite(rnp.value) && Number.isFinite(ratio) ? ratio * rnp.value : NaN;
        $('rnpConc').classList.toggle('bad', !Number.isFinite(rnp.value) || rnp.value <= 0);
        $('rKd').textContent = Number.isFinite(kd) ? `${fmtNum(kd)} ${rnp.unit}` : 'n/a';
        $('rHalf').textContent = halfTxt;
      } else {
        const xElb = ELB * k, v50 = vAt(0.5);
        $('rAct').textContent = (xElb * 100).toFixed(1) + '%';
        $('rEq').textContent = model(1, p).toFixed(3);
        $('rH50').textContent = Number.isFinite(v50) ? fmtNum(v50) : 'n/a (curve never reaches 0.5)';
      }
      placeEditor();
    }

    /* ======================= HOVER ======================= */
    const tip = $('hoverTip'), svgEl = $('plot');
    function hideHover() {
      tip.style.display = 'none';
      if (fitState) { fitState.hLine.setAttribute('display', 'none'); fitState.hDot.setAttribute('display', 'none'); }
    }
    svgEl.addEventListener('pointermove', ev => {
      const F = fitState;
      if (!F || ev.buttons || lblDrag) { hideHover(); return; }
      const r = svgEl.getBoundingClientRect(), s = P.W / r.width;
      const x = (ev.clientX - r.left) * s, y = (ev.clientY - r.top) * s;
      if (x < P.mL || x > P.mL + F.pW || y < P.mT || y > P.mT + F.pH) { hideHover(); return; }
      const R = 12 * s;
      let bp = null, bd = R;
      for (const q of F.pts) {
        const d = Math.hypot(F.sx(xFromV(q.v)) - x, F.sy(q.y) - y);
        if (d <= bd) { bd = d; bp = q; }
      }
      let best = null, cd = R;
      if (!bp) for (let px = x - R; px <= x + R; px += 0.5) {
        if (px < P.mL + F.zoneW) continue;
        const xv = F.x2v(px), yv = model(vFromX(xv), F.p);
        if (!Number.isFinite(yv)) continue;
        const d = Math.hypot(px - x, F.sy(yv) - y);
        if (d <= cd) { cd = d; best = { px, xv, yv }; }
      }
      const xname = AXIS.name;
      let px, py, html;
      if (bp) {
        px = F.sx(xFromV(bp.v)); py = F.sy(bp.y);
        html = `<b>${escapeHtml(texts().legData)}</b><br>${xname} = ${fmtT(xFromV(bp.v))}`
          + `<br>y = ${fmtNum(bp.y)}<br>${escapeHtml(texts().legFit)} = ${fmtNum(model(bp.v, F.p))}`;
      } else if (best) {
        px = best.px; py = F.sy(best.yv);
        html = `<b>${escapeHtml(texts().legFit)}</b><br>${xname} = ${fmtT(best.xv)}<br>y = ${fmtNum(best.yv)}`;
      } else { hideHover(); return; }
      F.hLine.setAttribute('x1', px); F.hLine.setAttribute('x2', px); F.hLine.setAttribute('display', 'inline');
      F.hDot.setAttribute('cx', px); F.hDot.setAttribute('cy', py); F.hDot.setAttribute('display', 'inline');
      tip.innerHTML = html; tip.style.display = 'block';
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let tx = ev.clientX + 14, ty = ev.clientY + 14;
      if (tx + w > window.innerWidth - 4) tx = ev.clientX - w - 14;
      if (ty + h > window.innerHeight - 4) ty = ev.clientY - h - 14;
      tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
    });
    svgEl.addEventListener('pointerleave', hideHover);

    /* ======================= EXPORT AND COPY ======================= */
    const safe = s => (String(s).replace(/[\/\\:*?"<>|]+/g, '_').trim() || 'fit');
    function svgString() {
      const clone = svgEl.cloneNode(true);
      clone.querySelectorAll('.hover-el, .lbl > title').forEach(n => n.remove());
      clone.querySelectorAll('.title-el').forEach(n => n.removeAttribute('display'));
      clone.setAttribute('width', P.W); clone.setAttribute('height', P.H);
      const stl = document.createElementNS(SVGNS, 'style');
      stl.textContent = 'text{font-family:-apple-system,Helvetica,Arial,sans-serif}';
      clone.insertBefore(stl, clone.firstChild);
      return new XMLSerializer().serializeToString(clone);
    }
    function pngBlob() {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(new Blob([svgString()], { type: 'image/svg+xml;charset=utf-8' }));
        const img = new Image();
        img.onload = () => {
          const sc = 3, c = document.createElement('canvas');
          c.width = P.W * sc; c.height = P.H * sc;
          const ctx = c.getContext('2d'); ctx.scale(sc, sc); ctx.drawImage(img, 0, 0, P.W, P.H);
          URL.revokeObjectURL(url);
          c.toBlob(b => b ? resolve(b) : reject(new Error('Could not render PNG.')), 'image/png');
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not render PNG.')); };
        img.src = url;
      });
    }
    function download(href, name) { const a = document.createElement('a'); a.href = href; a.download = name; a.click(); }
    function flash(btn, msg) {
      if (btn._html == null) btn._html = btn.innerHTML;   // the buttons carry a caret span
      btn.textContent = msg; btn.classList.add('done');
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.innerHTML = btn._html; btn.classList.remove('done'); }, 1400);
    }
    function copyText(s) {
      if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
      return new Promise((resolve, reject) => {   // fallback for non-secure contexts
        const ta = document.createElement('textarea');
        ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        ok ? resolve() : reject(new Error('Clipboard refused.'));
      });
    }
    async function doExport(act, fmt, btn) {
      try {
        if (act === 'dl') {
          const blob = fmt === 'svg'
            ? new Blob([svgString()], { type: 'image/svg+xml;charset=utf-8' })
            : await pngBlob();
          const url = URL.createObjectURL(blob);
          download(url, safe(titleInput.value) + '.' + fmt);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          flash(btn, 'Saved');
        } else if (fmt === 'svg') {
          await copyText(svgString());
          flash(btn, 'Copied');
        } else {
          const b = await pngBlob();
          if (!(navigator.clipboard && window.ClipboardItem && navigator.clipboard.write)) throw new Error('no api');
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
          flash(btn, 'Copied');
        }
      } catch (_) { flash(btn, 'Blocked'); }
    }
    function closePops(except) {
      document.querySelectorAll('.pop').forEach(p => { if (p !== except) p.classList.remove('open'); });
    }
    [['copyBtn', 'copyPop'], ['dlBtn', 'dlPop']].forEach(([b, pop]) => {
      $(b).addEventListener('click', e => {
        e.stopPropagation();
        const el = $(pop), open = el.classList.contains('open');
        closePops(); if (!open) el.classList.add('open');
      });
    });
    document.querySelectorAll('.pop button').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation(); closePops();
      const owner = e.currentTarget.closest('.menu').querySelector('.btn');
      doExport(e.currentTarget.dataset.act, e.currentTarget.dataset.fmt, owner);
    }));
    document.addEventListener('click', () => closePops());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePops(); });

    /* ======================= IN-PLACE TEXT EDITING ======================= */
    function caretIndexAt(key, cx, cy) {
      const el = svgEl.querySelector(`[data-edit-target='${key}']`);
      const n = (texts()[key] || '').length;
      if (!el || cx == null) return n;
      const text = el.closest('text');
      const p = svgEl.createSVGPoint(); p.x = cx; p.y = cy;
      const lp = p.matrixTransform(text.getScreenCTM().inverse());
      let i = text.getCharNumAtPosition(lp);
      if (i < 0) {
        const ext0 = n ? text.getExtentOfChar(0) : null;
        return ext0 && lp.x < ext0.x ? 0 : n;
      }
      const ext = text.getExtentOfChar(i);
      if (lp.x > ext.x + ext.width / 2) i++;
      return Math.min(i, n);
    }
    function startEdit(key, cx, cy) {
      const caret = caretIndexAt(key, cx, cy);
      if (editing) finishEdit(true);
      const inp = document.createElement('input');
      inp.className = 'svg-edit'; inp.value = texts()[key]; inp.spellcheck = false;
      editing = { key, inp, orig: texts()[key] };
      document.querySelector('.plotwrap').appendChild(inp);
      inp.addEventListener('input', () => { texts()[key] = inp.value; render(); });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finishEdit(true); }
        else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
      });
      inp.addEventListener('blur', () => finishEdit(true));
      render();
      setTimeout(() => { inp.focus(); inp.setSelectionRange(caret, caret); }, 0);
    }
    function finishEdit(ok) {
      if (!editing) return;
      const { key, inp, orig } = editing; editing = null;
      texts()[key] = ok ? (inp.value.trim() || BASE_TEXTS()[key]) : orig;
      inp.remove(); render();
    }
    const measureCtx = document.createElement('canvas').getContext('2d');
    function placeEditor() {
      if (!editing) return;
      const { key, inp } = editing;
      const el = svgEl.querySelector(`[data-edit-target='${key}']`); if (!el) return;
      const text = el.closest('text'), wrap = document.querySelector('.plotwrap');
      const wr = wrap.getBoundingClientRect(), k = svgEl.getBoundingClientRect().width / P.W;
      const fs = (+text.getAttribute('font-size') || 24) * k;
      const ff = getComputedStyle(text).fontFamily;
      inp.style.fontFamily = ff;
      measureCtx.font = `${fs}px ${ff}`;
      const w = Math.max(measureCtx.measureText(inp.value).width, 4) + 3;
      const L = Math.round(fs * 1.3), m = measureCtx.measureText('Hg');
      const A = m.fontBoundingBoxAscent, D = m.fontBoundingBoxDescent;
      const bOff = Number.isFinite(A) && Number.isFinite(D) ? (L - (A + D)) / 2 + A : fs * 0.93;
      const anchor = text.getAttribute('text-anchor') || 'start';
      const p = svgEl.createSVGPoint(); p.x = +text.getAttribute('x'); p.y = +text.getAttribute('y');
      const sp = p.matrixTransform(text.getScreenCTM());
      if (key === 'ylab') {
        const x = sp.x - wr.left, y = sp.y - wr.top;
        Object.assign(inp.style, { left: (x - (bOff - L / 2) - w / 2) + 'px', top: (y - L / 2) + 'px', transformOrigin: 'center', transform: 'rotate(-90deg)' });
      } else {
        const x = sp.x - wr.left - (anchor === 'middle' ? w / 2 : anchor === 'end' ? w : 0);
        Object.assign(inp.style, { left: x + 'px', top: (sp.y - wr.top - bOff) + 'px', transform: 'none' });
      }
      Object.assign(inp.style, { width: w + 'px', height: L + 'px', fontSize: fs + 'px', lineHeight: L + 'px' });
    }

    /* label dragging */
    let lblDrag = null;
    svgEl.addEventListener('pointerdown', ev => {
      const ax = ev.target.closest('.clickable[data-edit-target]');
      if (ax) { ev.preventDefault(); hideHover(); startEdit(ax.dataset.editTarget, ev.clientX, ev.clientY); return; }
      const g = ev.target.closest('.lbl'); if (!g) return;
      ev.preventDefault(); hideHover();
      if (ev.target.closest('.close')) { st().hidden[g.dataset.key] = true; render(); return; }
      const key = g.dataset.key, o = st().lblOff[key] || { dx: 0, dy: 0 };
      const tEl = ev.target.closest('[data-edit-target]');
      lblDrag = { key, g, sx: ev.clientX, sy: ev.clientY, dx: o.dx, dy: o.dy, editKey: tEl ? tEl.dataset.editTarget : null, moved: false };
      try { svgEl.setPointerCapture(ev.pointerId); } catch (_) { }
    });
    svgEl.addEventListener('pointermove', ev => {
      if (!lblDrag) return;
      const k = P.W / svgEl.getBoundingClientRect().width;
      if (Math.hypot(ev.clientX - lblDrag.sx, ev.clientY - lblDrag.sy) > 3) lblDrag.moved = true;
      if (!lblDrag.moved) return;
      const o = { dx: lblDrag.dx + (ev.clientX - lblDrag.sx) * k, dy: lblDrag.dy + (ev.clientY - lblDrag.sy) * k };
      st().lblOff[lblDrag.key] = o; lblDrag.g.setAttribute('transform', `translate(${o.dx} ${o.dy})`);
    });
    svgEl.addEventListener('pointerup', () => {
      const d = lblDrag; lblDrag = null;
      if (d && !d.moved && d.editKey) startEdit(d.editKey, d.sx, d.sy);
    });
    svgEl.addEventListener('dblclick', ev => {
      const gr = ev.target.closest('.grip'), g = gr && gr.closest('.lbl'); if (!g) return;
      delete st().lblOff[g.dataset.key]; g.setAttribute('transform', 'translate(0 0)');
    });

    /* ======================= TITLE ======================= */
    function placeTitle() {
      const r = svgEl.getBoundingClientRect(), k = r.width / P.W;
      if (!r.width) return;
      titleInput.style.left = (P.mL * k) + 'px';
      titleInput.style.width = ((P.W - P.mL - P.mR) * k) + 'px';
      titleInput.style.top = (20 * k) + 'px';
      titleInput.style.height = (38 * k) + 'px';
      titleInput.style.fontSize = (30 * k) + 'px';
      placePen();
    }
    function placePen() {
      const r = svgEl.getBoundingClientRect(), k = r.width / P.W; if (!r.width) return;
      const cs = getComputedStyle(titleInput);
      measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const w = measureCtx.measureText(titleInput.value || titleInput.placeholder).width;
      const pen = $('titlePen'), cx = (P.mL + (P.W - P.mL - P.mR) / 2) * k;
      pen.style.fontSize = (24 * k) + 'px';
      pen.style.left = Math.min(cx + w / 2 + 6 * k, (P.W - P.mR - 24) * k) + 'px';
      pen.style.top = (27 * k) + 'px';
    }
    new ResizeObserver(placeTitle).observe(svgEl);
    new ResizeObserver(() => fitGridHeight()).observe(document.querySelector('#dataGrid thead'));
    titleInput.addEventListener('input', () => {
      st().title = titleInput.value;
      const t = svgEl.querySelector('.title-el'); if (t) t.textContent = titleInput.value;
      placePen();
    });
    titleInput.addEventListener('keydown', e => { if (e.key === 'Enter') titleInput.blur(); });

    /* ======================= TABS AND WIRING ======================= */
    $('scaleBtn').addEventListener('click', () => {
      const S = st();
      S.scale = S.scale === 'log' ? 'linear' : 'log';
      syncButtons(); render();
    });
    $('resetLayout').addEventListener('click', () => {
      const S = st();
      for (const k in S.lblOff) delete S.lblOff[k];
      for (const k in S.hidden) delete S.hidden[k];
      render();
    });
    function syncButtons() {
      $('scaleBtn').textContent = 'Scale: ' + st().scale;
    }
    function setMode(m) {
      if (editing) finishEdit(true);
      mode = m;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.mode === m));
      sel = null;
      buildHead(); buildResults(); setFormula(); syncButtons();
      titleInput.value = st().title;
      buildGrid(); render(); placeTitle();
    }
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

    if (LOCK) {
      document.querySelector('.tabs').style.display = 'none';
      document.querySelector('h1').textContent = document.querySelector(`.tab[data-mode='${LOCK}']`).textContent;
    }
    if (['none', '0', 'off'].includes((PARAMS.get('title') || '').toLowerCase())) {
      document.querySelector('h1').style.display = 'none';
    }
    setMode(LOCK || 'time');

    function sendHeight() {
      const height = document.documentElement.scrollHeight || document.body.scrollHeight;
      window.parent.postMessage({ type: 'resize-iframe', height: height }, '*');
    }
    window.addEventListener('load', sendHeight);
    new MutationObserver(sendHeight).observe(document.body, { attributes: true, childList: true, subtree: true });
  </script>
</body>
