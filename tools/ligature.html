function currentColor() {
  if (selBlob != null && blobById(selBlob)) return blobById(selBlob).color;
  const qs = selStrands();
  return qs.length ? qs[0].color : lastColor;
}
const hexOut = document.getElementById('hexOut');
function buildColors() {
  const cur = currentColor(), base = baseOf(cur);
  hexOut.textContent = cur;
  const sw = (c, on) => `<button class="sw${on ? ' on' : ''}" style="background:${c}" data-color="${c}" title="${c}"></button>`;
  document.getElementById('baseRow').innerHTML = sw(BLACK, cur === BLACK) + Object.keys(OC).map(k => sw(OC[k][6], base === k)).join('');
  document.getElementById('shadeRow').innerHTML = base ? SHADES.map(i => sw(OC[base][i], cur === OC[base][i])).join('') : '';
}
function placeUnder(menu, btn) {
  const r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.left = Math.max(6, Math.min(r.left, innerWidth - menu.offsetWidth - 6)) + 'px';
}
swatch.onclick = () => {
  const open = pop.style.display === 'flex';
  exportMenu.style.display = 'none';
  pop.style.display = open ? 'none' : 'flex';
  if (!open) { buildColors(); placeUnder(pop, swatch); }
};
pop.addEventListener('mouseover', e => {
  const b = e.target.closest('.sw');
  if (b) hexOut.textContent = b.dataset.color;
});
pop.addEventListener('mouseleave', () => { hexOut.textContent = currentColor(); });
pop.addEventListener('click', e => {
  const b = e.target.closest('.sw');
  if (!b) return;
  const c = b.dataset.color;
  lastColor = c;
  if (selBlob != null) { pushHistory(); blobById(selBlob).color = c; }
  else if (sel.size) { pushHistory(); selStrands().forEach(q => q.color = c); }
  render();
  buildColors();
});

// ---------- export ----------
const anySel = () => sel.size || selBlob != null || selImport != null;
const exportIds = () => ({
  ids: (sel.size ? [...sel] : (anySel() ? [] : strands.map(q => q.id))).filter(id => byId(id) && byId(id).nodes.length > 1),
  bids: selBlob != null ? [selBlob] : (anySel() ? [] : blobs.map(b => b.id)),
  mids: selImport != null ? imports.filter(m => m.id === selImport) : (anySel() ? [] : imports),
});
function buildSVG() {
  const {ids, bids, mids} = exportIds();
  if (!ids.length && !bids.length && !mids.length) return null;
  const b = bounds(ids, bids, mids), pad = cfg.w + 6;
  const x = f(b.x - pad), y = f(b.y - pad), w = f(b.w + 2 * pad), h = f(b.h + 2 * pad);
  const txt = (t, p, c) => `<text x="${f(p.x)}" y="${f(p.y)}" fill="${c}" stroke="none" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">${t}</text>`;
  const one = q => {
    const g = G.get(q.id);
    const t = g.ticks.map(([a, c]) => `<line x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(c.x)}" y2="${f(c.y)}"/>`).join('');
    const l = g.lab ? txt('5′', g.lab.p5, q.color) + txt('3′', g.lab.p3, q.color) : '';
    const pv = blobPivot(q), rt = q.rot ? ` transform="rotate(${f(q.rot)} ${f(pv.x)} ${f(pv.y)})"` : '';
    return `<g id="strand-${q.id}" stroke="${q.color}"${rt}><g stroke-width="${cfg.tw}">${t}</g><path d="${g.d}" stroke-width="${cfg.w}" stroke-linecap="round" stroke-linejoin="round"/>${l}</g>`;
  };
  let defs = '', blobBody = '';
  for (const m of mids) blobBody += `<image href="${m.src}" x="${f(m.x)}" y="${f(m.y)}" width="${f(m.w)}" height="${f(m.h)}"` +
    (m.rot ? ` transform="rotate(${f(m.rot)} ${f(m.x + m.w / 2)} ${f(m.y + m.h / 2)})"` : '') + `/>\n`;
  for (const id of bids) {
    const g = BP.get(id), col = blobById(id).color;
    if (!g || !g.d) continue;
    const bb = blobById(id), bc = blobPivot(bb);
    const tr = bb.rot ? ` transform="rotate(${f(bb.rot)} ${f(bc.x)} ${f(bc.y)})"` : '';
    blobBody += `<g id="blob-${id}"${tr}><path d="${g.d}" fill="${blobRim(col)}"/>` +
      (g.dIn ? `<path d="${g.dIn}" fill="${col}" transform="translate(${INSET.dx} ${INSET.dy})"/>` : '') + `</g>\n`;
  }
  const groups = new Map(), loose = [];
  for (const q of strands.filter(q => ids.includes(q.id))) q.group ? (groups.get(q.group) || groups.set(q.group, []).get(q.group)).push(q) : loose.push(q);
  let body = loose.map(one).join('\n');
  for (const [gid, qs] of groups) body += `\n<g id="group-${gid}">${qs.map(one).join('')}</g>`;
  const model = JSON.stringify({
    v: 1,
    strands: strands.filter(q => ids.includes(q.id)),
    blobs: blobs.filter(b => bids.includes(b.id)),
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}">
<metadata id="ligature-model">${esc(model)}</metadata>
<defs>${defs}</defs>
${blobBody}<g fill="none">
${body}
</g>
</svg>`;
  return {svg, w, h};
}

// --- Excalidraw: every shape becomes a line element of sampled points ---
const rnd = () => Math.floor(Math.random() * 2 ** 31);
const rid = () => Math.random().toString(36).slice(2, 12);
function samplePath(d, stepLen = 2.5) {
  const out = [];
  for (const sp of d.split(/(?=M)/).map(t => t.trim()).filter(Boolean)) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    el.setAttribute('d', sp);
    svgEl.appendChild(el);
    const L = el.getTotalLength(), pts = [];
    for (let t = 0; t < L; t += stepLen) { const q = el.getPointAtLength(t); pts.push([q.x, q.y]); }
    const q = el.getPointAtLength(L);
    pts.push([q.x, q.y]);
    el.remove();
    if (pts.length > 1) out.push(pts);
  }
  return out;
}
function exEl(pts, o) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x = Math.min(...xs), y = Math.min(...ys);
  return {
    id: rid(), type: 'line', x: f(x), y: f(y), width: f(Math.max(...xs) - x), height: f(Math.max(...ys) - y),
    angle: 0, strokeColor: o.stroke, backgroundColor: o.bg || 'transparent', fillStyle: 'solid',
    strokeWidth: o.sw ?? 2, strokeStyle: 'solid', roughness: 0, opacity: 100, groupIds: o.groupIds || [],
    frameId: null, roundness: null, seed: rnd(), version: 1, versionNonce: rnd(), isDeleted: false,
    boundElements: null, updated: Date.now(), link: null, locked: false,
    points: pts.map(p => [f(p[0] - x), f(p[1] - y)]), lastCommittedPoint: null,
    startBinding: null, endBinding: null, startArrowhead: null, endArrowhead: null,
  };
}
function exText(t, p, color) {
  return {
    id: rid(), type: 'text', x: f(p.x - 9), y: f(p.y - 7), width: 18, height: 14, angle: 0,
    strokeColor: color, backgroundColor: 'transparent', fillStyle: 'solid', strokeWidth: 1, strokeStyle: 'solid',
    roughness: 0, opacity: 100, groupIds: [], frameId: null, roundness: null, seed: rnd(), version: 1,
    versionNonce: rnd(), isDeleted: false, boundElements: null, updated: Date.now(), link: null, locked: false,
    text: t, fontSize: 12, fontFamily: 2, textAlign: 'center', verticalAlign: 'middle',
    containerId: null, originalText: t, lineHeight: 1.2,
  };
}
function buildExcalidraw() {
  const {ids, bids} = exportIds();  // placed files stay out of the Excalidraw conversion
  if (!ids.length && !bids.length) return null;
  const elements = [];
  for (const id of bids) {
    const g = BP.get(id), bb = blobById(id), col = bb.color;
    if (!g || !g.outline.length) continue;
    const gid = [rid()], bc = blobPivot(bb), rot = bb.rot || 0;
    const place = (loop, dx, dy) => {
      const pts = loop.map(p => { const q = rot ? rotPt({x: p.x + dx, y: p.y + dy}, bc, rot) : {x: p.x + dx, y: p.y + dy}; return [q.x, q.y]; });
      pts.push(pts[0]);
      return pts;
    };
    // the body, then the lighter inset as its own shape; both fill-only, so nothing gets outlined
    for (const loop of g.outline) elements.push(exEl(place(loop, 0, 0), {stroke: blobRim(col), bg: blobRim(col), sw: 1, groupIds: gid}));
    for (const loop of g.inner || []) elements.push(exEl(place(loop, INSET.dx, INSET.dy), {stroke: col, bg: col, sw: 1, groupIds: gid}));
  }
  for (const q of strands.filter(q => ids.includes(q.id))) {
    const g = G.get(q.id), gid = [rid()], rot = q.rot || 0, pv = blobPivot(q);
    const wp = pts => rot ? pts.map(([x, y]) => { const r = rotPt({x, y}, pv, rot); return [r.x, r.y]; }) : pts;
    for (const pts of samplePath(g.d)) elements.push(exEl(wp(pts), {stroke: q.color, sw: cfg.w, groupIds: gid}));
    for (const [a, b] of g.ticks) elements.push(exEl(wp([[a.x, a.y], [b.x, b.y]]), {stroke: q.color, sw: cfg.tw, groupIds: gid}));
    if (g.lab) {
      elements.push(exText('5′', toWorld(q, g.lab.p5), q.color));
      elements.push(exText('3′', toWorld(q, g.lab.p3), q.color));
    }
  }
  return elements;
}
const excalidrawFile = els => JSON.stringify({
  type: 'excalidraw', version: 2, source: 'ligature',
  elements: els, appState: {gridSize: null, viewBackgroundColor: '#ffffff'}, files: {},
}, null, 2);

async function pngBlob(o, scale = 3) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(o.svg);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = Math.ceil(o.w * scale); c.height = Math.ceil(o.h * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const exportMenu = document.getElementById('exportMenu');
document.getElementById('export').onclick = () => {
  const open = exportMenu.style.display === 'flex';
  pop.style.display = 'none';
  exportMenu.style.display = open ? 'none' : 'flex';
  if (!open) placeUnder(exportMenu, document.getElementById('export'));
};
exportMenu.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  exportMenu.style.display = 'none';
  if (drawing) finishDraw();
  if (pdraw) finishProtein();
  const kind = b.dataset.ex;
  try {
    if (kind === 'exc' || kind === 'cexc') {
      const els = buildExcalidraw();
      if (!els || !els.length) { toast('Nothing to export'); return; }
      if (kind === 'exc') download(new Blob([excalidrawFile(els)], {type: 'application/json'}), 'ligature.excalidraw');
      else { await navigator.clipboard.writeText(JSON.stringify({type: 'excalidraw/clipboard', elements: els, files: {}})); toast('Paste into Excalidraw'); }
      return;
    }
    const o = buildSVG();
    if (!o) { toast('Nothing to export'); return; }
    if (kind === 'svg') download(new Blob([o.svg], {type: 'image/svg+xml'}), 'ligature.svg');
    else if (kind === 'png') download(await pngBlob(o), 'ligature.png');
    else if (kind === 'csvg') { await navigator.clipboard.writeText(o.svg); toast('SVG copied'); }
    else { await navigator.clipboard.write([new ClipboardItem({'image/png': pngBlob(o)})]); toast('PNG copied'); }
  } catch (err) { toast('Export failed: ' + err.message); }
});

// ---------- placing files ----------
const esc = t => String(t).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
function excalidrawToSVG(data) {
  const els = (data.elements || []).filter(e => e && !e.isDeleted);
  if (!els.length) throw new Error('no elements in it');
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const e of els) {
    x0 = Math.min(x0, e.x); y0 = Math.min(y0, e.y);
    x1 = Math.max(x1, e.x + (e.width || 0)); y1 = Math.max(y1, e.y + (e.height || 0));
  }
  const parts = [];
  for (const e of els) {
    const stroke = e.strokeColor || '#1e1e1e', sw = e.strokeWidth || 1;
    const fill = e.backgroundColor && e.backgroundColor !== 'transparent' ? e.backgroundColor : 'none';
    if (Array.isArray(e.points) && e.points.length > 1) {
      const pts = e.points.map(p => `${f(e.x + p[0])},${f(e.y + p[1])}`).join(' ');
      parts.push(`<polyline points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`);
    } else if (e.type === 'rectangle') {
      parts.push(`<rect x="${f(e.x)}" y="${f(e.y)}" width="${f(e.width)}" height="${f(e.height)}" rx="${e.roundness ? 8 : 0}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
    } else if (e.type === 'ellipse') {
      parts.push(`<ellipse cx="${f(e.x + e.width / 2)}" cy="${f(e.y + e.height / 2)}" rx="${f(e.width / 2)}" ry="${f(e.height / 2)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
    } else if (e.type === 'text') {
      parts.push(`<text x="${f(e.x)}" y="${f(e.y + (e.fontSize || 16))}" fill="${stroke}" font-size="${e.fontSize || 16}" font-family="system-ui, sans-serif">${esc(e.text || '')}</text>`);
    }
  }
  if (!parts.length) throw new Error('nothing drawable in it');
  const pad = 8, w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad;
  return {w, h, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${f(x0 - pad)} ${f(y0 - pad)} ${f(w)} ${f(h)}" width="${f(w)}" height="${f(h)}">${parts.join('')}</svg>`};
}
function svgSize(root) {
  let w = parseFloat(root.getAttribute('width')), h = parseFloat(root.getAttribute('height'));
  const v = root.getAttribute('viewBox');
  if ((!w || !h) && v) { const p = v.trim().split(/[\s,]+/).map(Number); w = p[2]; h = p[3]; }
  return {w: w || 300, h: h || 300};
}
// an SVG this app wrote comes back as real objects instead of a picture
function importModel(json) {
  const data = JSON.parse(json);
  if (!Array.isArray(data.strands) || !Array.isArray(data.blobs)) throw new Error('no model');
  pushHistory();
  clearSel();
  const idmap = new Map();
  for (const q of data.strands) {
    const old = q.id, n = {...q, id: nextId++, pair: null, group: q.group};
    idmap.set(old, n.id);
    strands.push(n);
    zAdd('s:' + n.id);
    sel.add(n.id);
  }
  for (const q of data.strands) {  // relink complements among the imported ones
    if (q.pair == null || !idmap.has(q.pair)) continue;
    byId(idmap.get(q.id)).pair = idmap.get(q.pair);
  }
  for (const b of data.blobs) {
    const n = {...b, id: nextBid++, nodes: b.nodes.map(x => ({...x}))};
    blobs.push(n);
    zAdd('b:' + n.id);
    selBlob = n.id;
    selBlobNode = n.nodes[0].id;
  }
  if (selBlob != null) sel.clear();
  render();
  return (data.strands.length + data.blobs.length) + ' objects';
}
function addImport(name, txt) {
  let svg, w, h;
  if (!txt.trim().startsWith('{')) {
    const probe = new DOMParser().parseFromString(txt, 'image/svg+xml');
    const meta = probe.getElementById && probe.getElementById('ligature-model');
    if (meta && meta.textContent.trim()) { toast(name + ': ' + importModel(meta.textContent)); return; }
  }
  if (txt.trim().startsWith('{')) {
    const data = JSON.parse(txt);
    if (!Array.isArray(data.elements)) throw new Error('not an Excalidraw file');
    ({svg, w, h} = excalidrawToSVG(data));
  } else {
    const doc = new DOMParser().parseFromString(txt, 'image/svg+xml');
    if (doc.querySelector('parsererror') || doc.documentElement.nodeName !== 'svg') throw new Error('not a valid SVG file');
    ({w, h} = svgSize(doc.documentElement));
    svg = txt;
  }
  pushHistory();
  const r = host.getBoundingClientRect(), c = draw.point(r.left + r.width / 2, r.top + r.height / 2);
  const k = Math.min(1, 320 / Math.max(w, h));
  imports.push({
    id: nextImp++, name, rot: 0, x: c.x - w * k / 2, y: c.y - h * k / 2, w: w * k, h: h * k,
    src: 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
  });
  zAdd('m:' + imports.at(-1).id);
  clearSel();
  selImport = imports.at(-1).id;
  render();
  toast(name);
}
const fileInput = document.getElementById('file');
document.getElementById('upload').onclick = () => fileInput.click();
fileInput.onchange = async e => {
  const file = e.target.files[0];
  fileInput.value = '';
  if (!file) return;
  try { addImport(file.name, await file.text()); }
  catch (err) { toast(file.name + ': ' + err.message); }
};
// dropping a file on the canvas places it as well
for (const ev of ['dragenter', 'dragover']) addEventListener(ev, e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
addEventListener('drop', async e => {
  e.preventDefault();
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  try { addImport(file.name, await file.text()); }
  catch (err) { toast(file.name + ': ' + err.message); }
});

// ---------- misc ----------
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.opacity = 0, 1800);
}
document.addEventListener('click', e => {
  if (bar.contains(e.target) || pop.contains(e.target) || exportMenu.contains(e.target) || layersEl.contains(e.target)) return;
  pop.style.display = 'none';
  exportMenu.style.display = 'none';
  if (layersOpen) { layersOpen = false; render(); }
});
setVB();
